[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "Analyse heuristique des mails reçus pour détecter le phishing (IMAP, hors ligne)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
include = ["phishguard*"]
